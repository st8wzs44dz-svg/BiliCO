name: Build BiliCO keep-screen-on APK

on:
  push:
    branches: [build/keep-screen-on-apk]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout BiliCO
        uses: actions/checkout@v7
        with:
          path: BiliCO
          persist-credentials: false
      - name: Checkout COUI 17
        uses: actions/checkout@v7
        with:
          repository: Costben/coui17
          ref: 14d1258b2076f9d9d5f5b47a8a4b71dcb5a6249a
          path: coui
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
          cache-disabled: true
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Publish the COUI Android libraries locally
        working-directory: coui
        run: >-
          gradle publishAndroidPublicationToLocalRepository
          publishKotlinMultiplatformPublicationToLocalRepository
          -x dokkaGenerate --no-daemon --no-configuration-cache --max-workers=2
      - name: Assemble the BiliCO test APK
        working-directory: BiliCO
        run: gradle :app:assembleDebug --no-daemon --max-workers=2
      - name: Verify and stage the APK
        working-directory: BiliCO
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" | grep "^package:"
          mkdir -p dist
          cp "$apk" dist/BiliCO-0.2.11-pre-keep-screen-on-debug.apk
          sha256sum dist/*.apk
      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: BiliCO-keep-screen-on-APK
          path: BiliCO/dist/*.apk
          if-no-files-found: error
          retention-days: 7
